name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: arthurrl/vulkan-dev:lts
      options: --user 0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install C++ quality tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang-format-21 clang-tidy-21

      - name: Check C++ formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ci/check-cpp.py format --base "$BASE_SHA"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          -DINK_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Lint C++ changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ci/check-cpp.py lint --base "$BASE_SHA" --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  test-windows:
    name: Run tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Install nlohmann_json (vcpkg)
        # windows-latest ships vcpkg preinstalled at $VCPKG_INSTALLATION_ROOT;
        # the static triplet builds it against the static CRT (/MT), which is
        # why Configure below passes CMAKE_MSVC_RUNTIME_LIBRARY: CMake
        # otherwise defaults this project to /MD and the link fails with
        # LNK2038.
        run: vcpkg install nlohmann-json:x64-windows-static

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded$<$<CONFIG:Debug>:Debug>"
          -DINK_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
